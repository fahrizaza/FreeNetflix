<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link href="src/output.css" rel="stylesheet">
  <!-- Ikon tab HARUS persegi. Sebelumnya berkas ini 1007x516 -- spanduk
       mendatar dengan logo di tengah dan latar hitam luas di kiri-kanan.
       Dimampatkan browser ke kotak 16 piksel, logonya tinggal 6 piksel dan
       gepeng dua kali lipat, jadi yang tampil praktis kotak hitam kosong.
       Berkas di bawah ini potongan persegi dari gambar yang sama. -->
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <title>CinemaHub</title>
</head>
<body class="bg-gray-950 text-white">
  <!-- Gerbang: layar daftar/masuk, pemilih profil, dan kotak PIN.
       Isinya digambar oleh script.js sesuai keadaan. -->
  <div id="gate" class="fixed inset-0 z-[70] hidden overflow-y-auto bg-gray-950"></div>

  <div id="app" class="hidden">
  <header class="border-b border-slate-800">
    <!-- Padding sengaja disamakan dengan baris film (px-4 md:px-8), bukan
         dibatasi max-w. Di monitor lebar dan TV, header yang dipatok 1152px
         membuat logonya menjorok ratusan piksel ke dalam sementara kartu film
         mulai dari tepi -- dua garis kiri yang berbeda di halaman yang sama. -->
    <nav class="flex items-center justify-between gap-3 px-4 py-3 md:px-8 md:py-4">
      <a href="#" class="shrink-0 text-lg font-semibold tracking-wide text-red-600 md:text-xl">CinemaHub</a>

      <div id="nav-sections" class="hidden gap-6 text-sm md:flex lg:gap-8">
        <button type="button" data-section-link="home" class="text-neutral-400 transition hover:text-white">Home</button>
        <button type="button" data-section-link="series" class="text-neutral-400 transition hover:text-white">Series</button>
        <button type="button" data-section-link="movies" class="text-neutral-400 transition hover:text-white">Movies</button>
        <button type="button" data-section-link="new" class="text-neutral-400 transition hover:text-white">New &amp; Popular</button>
      </div>

      <div class="flex min-w-0 items-center gap-2 md:gap-4">
        <form id="search-form" class="flex min-w-0 items-center gap-2">
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="Cari film..."
            class="w-32 min-w-0 rounded border border-neutral-700 bg-black/60 px-3 py-2 text-sm outline-none transition-all placeholder:text-neutral-500 focus:border-neutral-400 sm:w-40 sm:focus:w-56"
          />
          <button type="submit" class="hidden rounded border border-neutral-700 px-3 py-2 text-sm hover:bg-neutral-800 sm:block">Search</button>
        </form>
        <div class="relative shrink-0">
          <button id="profile-button" type="button" class="flex items-center gap-2">
            <span id="profile-avatar" class="block h-8 w-8 overflow-hidden rounded"></span>
            <svg
              id="profile-caret"
              viewBox="0 0 24 24"
              class="h-3 w-3 text-white transition-transform duration-300"
              fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"
            >
              <path d="M5 9l7 7 7-7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div
            id="profile-menu"
            class="invisible absolute right-0 z-50 mt-3 w-60 origin-top-right -translate-y-2 scale-95 rounded border border-neutral-700 bg-black/90 py-2 opacity-0 shadow-2xl backdrop-blur transition duration-200"
          ></div>
        </div>
      </div>
    </nav>
  </header>

  <section
    id="hero"
    class="relative m-4 h-[55vh] overflow-hidden rounded-2xl bg-gray-900 bg-cover bg-center md:m-8 md:h-[70vh] md:rounded-4xl"
  >
    <!-- src sengaja kosong: diisi JS hanya kalau perangkat dan jaringannya
         memang layak, supaya 14 MB tidak ikut terunduh percuma -->
    <video
      id="hero-video"
      class="pointer-events-none absolute inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-700"
      muted playsinline preload="none"
    ></video>

    <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/90 via-black/25 to-transparent"></div>

    <button
      id="hero-mute"
      type="button"
      class="absolute right-4 top-4 z-20 hidden h-10 w-10 items-center justify-center rounded-full border border-white/50 bg-black/40 text-white transition hover:bg-black/70 md:right-6 md:top-6"
    ></button>

    <div class="relative z-10 flex h-full flex-col justify-end p-5 md:p-10">
      <h1 id="hero-title" class="text-2xl font-bold md:text-4xl"></h1>
      <div id="hero-meta" class="flex flex-row flex-wrap gap-x-4 py-2 text-xs text-neutral-300 md:text-sm"></div>
      <p id="hero-desc" class="line-clamp-3 max-w-2xl text-sm md:line-clamp-none md:text-lg"></p>
      <div class="mt-4 flex space-x-3 md:space-x-4">
        <button id="hero-play" class="rounded-4xl bg-white px-5 py-2 text-sm font-bold text-black hover:bg-gray-300 md:px-6 md:py-3 md:text-base">Play</button>
        <button id="hero-info" class="rounded-4xl bg-gray-600 px-5 py-2 text-sm font-bold text-white hover:bg-gray-500 md:px-6 md:py-3 md:text-base">More Info</button>
      </div>
    </div>
  </section>

  <!-- md:px-8 menyamai baris film dan header; sebelumnya md:px-10 membuat
       hasil pencarian punya garis kiri sendiri, garis ketiga di halaman ini -->
  <section id="search-results" class="hidden px-4 pb-16 pt-6 md:px-8">
    <p id="search-status" class="mb-5 text-sm text-neutral-400"></p>
    <div
      id="search-grid"
      data-row="search"
      class="grid grid-cols-2 gap-x-2 gap-y-6 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
    ></div>
  </section>

  <main id="rows" class="pb-16 md:p-10"></main>
  </div>

  <div id="modal" class="hidden"></div>
  <div id="player" class="hidden"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
